services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    ports:
      - "6333:6333"
    volumes:
      - ./infra/qdrant_storage:/qdrant/storage
    networks:
      - triton_net

  triton:
    build:
      context: .
      args:
        TRITON_VERSION: "25.05-py3"
        VLLM_BACKEND_SHA: "b41f716d15100dc7bcbea27ebea20906452dadf5"
    image: triton-multimodal-rag:25.05-py3
    container_name: triton-server
    restart: unless-stopped
    shm_size: '16g'
    env_file:
      - .env
    environment:
      # Host scripts use localhost; inside the compose network Qdrant is `qdrant`.
      - QDRANT_URL=http://qdrant:6333
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    ports:
      - "${TRITON_HTTP_PORT:-8000}:8000" # HTTP
      - "${TRITON_GRPC_PORT:-8001}:8001" # gRPC
      - "${TRITON_METRICS_PORT:-8002}:8002" # Metrics
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ./model_repository:/models
    command: >
      tritonserver
      --model-repository=/models
      --log-verbose=1
      --allow-grpc=true
      --allow-http=true
      --strict-readiness=false
      --backend-config=python,shm-default-byte-size=67108864
    networks:
      - triton_net

networks:
  triton_net:
    driver: bridge

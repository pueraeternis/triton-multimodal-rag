[project]
name = "triton-multimodal-rag"
version = "0.1.0"
description = "Triton BLS reference architecture for multimodal RAG with YOLO guardrails, Qdrant retrieval, and vLLM generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.0",
    "numpy>=2.3.5",
    "onnxruntime-gpu>=1.23.2",
    "optimum[onnxruntime]>=2.0.0",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "qdrant-client>=1.16.2",
    "sentence-transformers>=5.2.0",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchvision>=0.24.1",
    "transformers<4.56.0",
    "tritonclient[all]>=2.63.0",
    "ultralytics>=8.3.240",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["model_repository"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

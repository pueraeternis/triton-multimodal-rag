<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 12px; fill: #334155; }
      .small { font-size: 10px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .triton { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 12; }
      .external { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
      .stage { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
      .line { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 4; }
    </style>
  </defs>

  <text x="460" y="28" text-anchor="middle" class="title">Multimodal RAG  Triton BLS Architecture</text>

  <!-- Client -->
  <rect x="20" y="170" width="100" height="50" class="box"/>
  <text x="70" y="200" text-anchor="middle" class="label">Client</text>

  <!-- Triton boundary -->
  <rect x="160" y="50" width="560" height="320" class="triton"/>
  <text x="180" y="75" class="label" font-weight="600">Triton Inference Server</text>

  <!-- BLS Orchestrator -->
  <rect x="200" y="100" width="140" height="50" class="stage"/>
  <text x="270" y="130" text-anchor="middle" class="label">BLS Orchestrator</text>

  <!-- Models -->
  <rect x="400" y="90" width="120" height="40" class="stage"/>
  <text x="460" y="115" text-anchor="middle" class="label">yolo_onnx</text>
  <text x="460" y="128" text-anchor="middle" class="small">1. Vision</text>

  <rect x="400" y="150" width="120" height="40" class="stage"/>
  <text x="460" y="175" text-anchor="middle" class="label">SentenceTransformer</text>
  <text x="460" y="188" text-anchor="middle" class="small">2. Embed (in-process)</text>

  <rect x="400" y="210" width="120" height="40" class="stage"/>
  <text x="460" y="235" text-anchor="middle" class="label">reranker_py</text>
  <text x="460" y="248" text-anchor="middle" class="small">4. Rerank</text>

  <rect x="400" y="270" width="120" height="40" class="stage"/>
  <text x="460" y="295" text-anchor="middle" class="label">llm_vllm</text>
  <text x="460" y="308" text-anchor="middle" class="small">5. Generate</text>

  <!-- Qdrant -->
  <rect x="760" y="170" width="120" height="50" class="external"/>
  <text x="820" y="195" text-anchor="middle" class="label">Qdrant</text>
  <text x="820" y="210" text-anchor="middle" class="small">3. Retrieve (external)</text>

  <!-- Arrows -->
  <path d="M120 195 L195 125" class="line"/>
  <path d="M340 125 L395 110" class="line"/>
  <path d="M340 125 L395 170" class="line"/>
  <path d="M520 170 L600 195 L755 195" class="line dashed"/>
  <path d="M755 195 L600 195 L520 170" class="line dashed"/>
  <path d="M340 125 L395 230" class="line"/>
  <path d="M340 125 L395 290" class="line"/>

  <!-- Legend -->
  <rect x="200" y="330" width="12" height="12" class="triton"/>
  <text x="220" y="341" class="small">In-Triton</text>
  <rect x="310" y="330" width="12" height="12" class="external"/>
  <text x="330" y="341" class="small">External service</text>
  <text x="200" y="360" class="small">embedding_onnx exists but is not in the active BLS path (see MODEL_REPOSITORY.md)</text>
</svg>
